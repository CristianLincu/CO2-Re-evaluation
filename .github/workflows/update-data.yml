name: Update dashboard data

on:
  schedule:
    # Every 30 minutes. GitHub cron is best-effort and may drift under load.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # A solve takes about 60 s end to end; the ceiling is here to stop a
    # hung API call from occupying a runner, not because the work is close
    # to it.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: python pipeline/run.py
        env:
          # Keep the scheduled run inside its window even if a solve is slow.
          GA_EPOCHS: "200"

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A solve takes about a minute, so the remote can move while this job
          # is running. Rebuild the commit on top of whatever main is now and
          # retry, rather than failing the run over a race.
          cp docs/data/latest.json "$RUNNER_TEMP/latest.json"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/latest.json" docs/data/latest.json
            git add docs/data/latest.json

            if git diff --staged --quiet; then
              echo "No changes to commit."
              exit 0
            fi

            git commit -m "chore: refresh dashboard data"
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected; the remote moved. Retrying."
            sleep $((attempt * 5))
          done

          echo "Could not push after 3 attempts."
          exit 1
